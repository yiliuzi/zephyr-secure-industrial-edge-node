# Console and logging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# RTOS functionality
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y

# Stack diagnostics
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# Runtime diagnostics
CONFIG_ASSERT=y
CONFIG_REBOOT=y